# agent-resources — a reusable team of coding agents + the skills they run on.
# Consumed skills (from other repos) and this library's own first-party skills are
# both declared here. Agents + commands live in .claude/ and are installed globally
# (see scripts/install-global.sh) or copied per project.
tools = ["claude"]

dependencies = [
    # --- consumed skills (installed via `agr add <handle>`) ---
    {handle = "anthropics/skills/frontend-design", type = "skill"},
    {handle = "kasperjunge/make-research", type = "skill"},
    {handle = "anthropics/skills/skill-creator", type = "skill"},
    {handle = "anthropics/skills/doc-coauthoring", type = "skill"},
    {handle = "anthropics/skills/pptx", type = "skill"},

    # --- this library's own workflow skills (the entry points / "team-lead") ---
    {path = "./.claude/skills/build", type = "skill"},
    {path = "./.claude/skills/discovery", type = "skill"},
    {path = "./.claude/skills/quick", type = "skill"},
    {path = "./.claude/skills/ship", type = "skill"},
    {path = "./.claude/skills/progress", type = "skill"},
    {path = "./.claude/skills/retro", type = "skill"},

    # --- this library's own method skills (the "how" the agents load) ---
    {path = "./.claude/skills/product-discovery", type = "skill"},
    {path = "./.claude/skills/prototype-to-validate", type = "skill"},
    {path = "./.claude/skills/sprint-delivery", type = "skill"},
    {path = "./.claude/skills/discovery-value-proposition", type = "skill"},
    {path = "./.claude/skills/discover-solution-space", type = "skill"},
    {path = "./.claude/skills/architecture-design", type = "skill"},
    {path = "./.claude/skills/work-breakdown", type = "skill"},
    {path = "./.claude/skills/spec-state", type = "skill"},
    {path = "./.claude/skills/dev-prod-isolation", type = "skill"},
    {path = "./.claude/skills/threat-model", type = "skill"},
    {path = "./.claude/skills/platform-reliability", type = "skill"},
    {path = "./.claude/skills/code-review-rubric", type = "skill"},
    {path = "./.claude/skills/verify-changes", type = "skill"},
    {path = "./.claude/skills/agent-retro", type = "skill"},
    {path = "./.claude/skills/project-cleanup", type = "skill"},
]
